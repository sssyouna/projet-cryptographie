<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Omar Auth Server</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            max-width: 450px; 
            margin: 30px auto; 
            padding: 25px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-form { 
            border: 3px dashed #1e3c72; 
            padding: 25px; 
            border-radius: 15px; 
            background: white;
            text-align: center;
        }
        h2 { 
            color: #1e3c72; 
            margin-top: 0;
            font-size: 28px;
        }
        .client-info {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #1e3c72;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #1e3c72;
            outline: none;
            box-shadow: 0 0 5px rgba(30, 60, 114, 0.3);
        }
        button { 
            background: #1e3c72; 
            color: white; 
            padding: 14px 25px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.3s;
        }
        button:hover { 
            background: #2a5298; 
            transform: scale(1.05);
        }
        .demo-creds {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px dashed #ffc107;
            font-size: 14px;
        }
        .fun-icon {
            font-size: 40px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="login-form">
        <div class="fun-icon"></div>
        <h2>Hey there!</h2>
        <p>Looks like you want to log in to <strong>badr_app</strong></p>
        
        <div class="client-info">
            <p>They want to access:</p>
            <p><strong>profile read:orders write:orders</strong></p>
        </div>
        
        <form method="POST" action="/authenticate">
            <input type="hidden" name="auth_req_id" value="auth_req_example">
            <label>Username:</label>
            <input type="text" name="username" placeholder="Type your username here..." required>
            <label>Password:</label>
            <input type="password" name="password" placeholder="Shhh... secret password..." required>
            <button type="submit">Let me in!</button>
        </form>
        
        <div class="demo-creds">
            <p>Hint: Try <strong>alice</strong> with <strong>password123</strong></p>
            <p>(Don't worry, we won't tell anyone!)</p>
        </div>
    </div>
</body>
</html>
